[theme]
base            = "light"
primaryColor    = "#16a34a"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f0fdf4"
textColor       = "#0f1f0f"
font            = "sans serif"

[server]
headless        = true
enableCORS      = false
enableXsrfProtection = false

[browser]
gatherUsageStats = false
